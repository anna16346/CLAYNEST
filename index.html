<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>CLAYNEST</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Секція: популярні -->
    <section class="favorites">

        <!-- Заголовок -->
        <div class="favorites-header">
            <h2></h2>
            <p></p>
        </div>

        <!-- Блок з товарами -->
        <div class="products-wrapper">

            <!-- Стрілка вліво -->
            <button class="arrow-left"></button>

            <!-- Список товарів -->
            <div class="products">

                <!-- Картка товару -->
                <div class="card">

                    <!-- Картинка -->
                    <div class="card-image">
                        <img>
                    </div>

                    <!-- Інформація -->
                    <div class="card-info">

                        <!-- Назва + ціна -->
                        <div class="card-top">
                            <p class="product-name"></p>
                            <p class="price"></p>
                        </div>

                        <!-- Рейтинг -->
                        <div class="rating"></div>

                        <!-- Кольори + іконка -->
                        <div class="card-bottom">
                            <div class="colors"></div>
                            <div class="icon"></div>
                        </div>

                    </div>

                </div>

                <!-- ще картки... -->

            </div>

            <!-- Стрілка вправо -->
            <button class="arrow-right"></button>

        </div>
    </section>

    <!-- Секція: історія -->
    <section class="story">

        <!-- Картинка -->
        <div class="story-image">
            <img>
        </div>

        <!-- Текст -->
        <div class="story-content">

            <h2></h2>

            <p></p>

            <!-- Посилання -->
            <a class="more"></a>

            <!-- Теги -->
            <div class="tags">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </section>

<script src="js/main.js"></script>
</body>
</html>
